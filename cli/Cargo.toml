[package]
name = "drift"
version = "0.1.0"
edition = "2021"
description = "CLI client for Drift, a personal RSS reader"
authors = ["iuhoay <iuhoay@gmail.com>"]
license = "AGPL-3.0-only"
publish = false

[[bin]]
name = "drift"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
dirs = "6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
ureq = { version = "2.12", features = ["json"] }

[dev-dependencies]
tempfile = "3"
