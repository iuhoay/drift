name: CLI release

on:
  push:
    tags:
      - "cli/v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release --manifest-path cli/Cargo.toml

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: drift-${{ matrix.target }}
          path: cli/target/release/drift

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Name binaries
        run: |
          mkdir -p release
          for dir in dist/drift-*; do
            mv "$dir/drift" "release/$(basename "$dir")"
          done
          chmod +x release/*

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release create "$tag" release/* \
            --title "drift CLI ${tag#cli/}" \
            --generate-notes \
            --latest=false
